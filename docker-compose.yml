version: '3.8'

services:
  norma-juridica:
    container_name: norma_juridica_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-}
      - SITE_DOMAIN=${SITE_DOMAIN:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
      - NEWS_API_BASE_URL=${NEWS_API_BASE_URL:-https://news-sources-api.vercel.app}
      - NEWS_API_FALLBACK_URL=${NEWS_API_FALLBACK_URL:-https://news-sources-api.vercel.app}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
